[project]
name = "franklin-client"
version = "0.1.0"
description = "Franklin API Python client"
readme = "README.md"
authors = [
    { name = "Robert Ernst", email = "r.f.ernst-3@umcutrecht.nl" }
]
requires-python = "~=3.13.0"
dependencies = [
    "loguru>=0.7.3",
    "pydantic-settings>=2.11.0",
    "requests>=2.32.5",
    "typer>=0.20.0",
]

[project.scripts]
franklin = 'franklin_client.cli:app'

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "python-dotenv>=1.2.1",
    "ruff>=0.14.2",
]

[tool.ruff]
line-length = 127
