name: Test
on:
  push:
    branches:
      - main
      - develop
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "uv_cache"
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        env:
          POSTMAN_FRANKLIN_MOCKUP_URI: ${{ secrets.POSTMAN_FRANKLIN_MOCKUP_URI }}
        run: uv run pytest tests
